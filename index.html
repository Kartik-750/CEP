<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vendor To Customer 🌿</title>
  <style>
    :root{
      --green:#2e7d32; 
      --accent:#1e88e5; 
      --success:#43a047; 
      --danger:#e53935;
      --bg:#f9fdf8; 
      --card:#ffffffcc; 
      --muted:#555;
    }
    *{box-sizing:border-box;transition:all .2s ease}
    body{
      font-family:"Poppins",system-ui,Arial,sans-serif;
      margin:0;
      color:#111;
      background:url('https://5.imimg.com/data5/ME/GI/MY-65021751/all-type-of-farm-fresh-vegetables-1000x1000.jpg') no-repeat center center fixed;
      background-size:cover;
    }
    header{
      background:linear-gradient(90deg,#2e7d32,#43a047);
      color:#fff;
      padding:14px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow:0 4px 12px rgba(0,0,0,.25);
      position:sticky;
      top:0;
      z-index:10;
    }
    header h1{margin:0;font-size:1.4rem;font-weight:600;letter-spacing:.5px}
    header .controls{display:flex;gap:10px;align-items:center}
    main{max-width:1100px;margin:30px auto;padding:0 14px}
    section.card{
      background:var(--card);
      padding:18px;
      border-radius:14px;
      box-shadow:0 10px 25px rgba(0,0,0,.15);
      margin-bottom:22px;
      backdrop-filter:blur(6px);
    }
    section.card h2{
      margin-top:0;font-size:1.25rem;color:var(--green);
      border-left:4px solid var(--green);padding-left:10px;
    }
    .product{
      display:inline-block;vertical-align:top;
      width:calc(33% - 12px);
      background:#ffffffcc;
      border-radius:12px;
      box-shadow:0 5px 15px rgba(0,0,0,.1);
      margin:6px;
      overflow:hidden;
      text-align:center;
      transition:transform .2s ease;
    }
    .product:hover{transform:translateY(-5px)}
    .product img{width:100%;height:160px;object-fit:cover;border-bottom:1px solid #eee}
    .product-details{padding:10px}
    .muted{color:var(--muted);font-size:.95rem}
    .btn{
      display:inline-block;padding:8px 12px;border-radius:8px;
      border:0;cursor:pointer;font-weight:600;font-size:.95rem;
    }
    .btn-small{padding:6px 8px;font-size:.85rem;border-radius:6px}
    .btn-green{background:var(--success);color:#fff}
    .btn-red{background:var(--danger);color:#fff}
    .btn-blue{background:var(--accent);color:#fff}
    .btn:hover{opacity:.9}
    .input-box{
      width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;
      margin:6px 0;font-size:1rem;
    }
    table{width:100%;border-collapse:collapse;margin-top:8px;background:#ffffffcc;border-radius:10px;overflow:hidden}
    th,td{padding:10px;border-bottom:1px solid #f0f0f0;text-align:left}
    th{background:#f2f2f2aa;font-weight:600;color:#333}
    .qty-controls{display:flex;align-items:center;gap:6px}
    @media (max-width:960px){.product{width:calc(50% - 10px)}}
    @media (max-width:640px){.product{width:100%}}
  </style>
</head>
<body>
  <header>
    <h1>Vendor To Customer 🌿</h1>
    <div class="controls">
      <span>Role:</span>
      <select id="roleSelect" aria-label="Select role">
        <option value="customer">Customer</option>
        <option value="vendor">Vendor</option>
      </select>
    </div>
  </header>

  <main id="main"></main>

  <script>
    const KEY_PRODUCTS='f2h_products';
    const KEY_CART='f2h_cart';
    const KEY_ROLE='f2h_role';
    let products=JSON.parse(localStorage.getItem(KEY_PRODUCTS)||'[]');
    let cart=JSON.parse(localStorage.getItem(KEY_CART)||'[]');
    const roleSelect=document.getElementById('roleSelect');
    const main=document.getElementById('main');
    const savedRole=localStorage.getItem(KEY_ROLE)||'customer';
    roleSelect.value=savedRole;
    roleSelect.addEventListener('change',()=>{localStorage.setItem(KEY_ROLE,roleSelect.value);render();});
    function saveAll(){localStorage.setItem(KEY_PRODUCTS,JSON.stringify(products));localStorage.setItem(KEY_CART,JSON.stringify(cart));}
    function sanitizeText(t){return String(t??'').trim();}
    function findProduct(id){return products.find(p=>p.id===id);}
    function productImageURL(p){return p.img||'https://via.placeholder.com/400x300?text=Product';}

    function render(){
      main.innerHTML='';
      if(roleSelect.value==='vendor') renderVendor();
      else renderCustomer();
      saveAll();
    }

    function renderCustomer(){
      const sec=sectionCard('Available Products');
      const visible=products.filter(p=>p.published&&p.qty>0);
      if(visible.length===0)sec.appendChild(pText('No products available.'));
      else visible.forEach(p=>sec.appendChild(customerProductNode(p)));
      main.appendChild(sec);
      main.appendChild(renderCartSection());
    }

    function customerProductNode(p){
      const wrap=document.createElement('div');
      wrap.className='product';
      const img=document.createElement('img');
      img.src=productImageURL(p);img.alt=p.name;
      const details=document.createElement('div');
      details.className='product-details';
      const name=document.createElement('h4');name.textContent=p.name;
      const price=document.createElement('div');price.className='muted';price.textContent=`Price: ₹${p.price}`;
      const stock=document.createElement('div');stock.className='muted';stock.textContent=`Stock: ${p.qty}`;
      const vendor=document.createElement('div');vendor.className='muted';
      vendor.textContent=`Vendor: ${p.vendorName||'Unknown'} | 📞 ${p.vendorPhone||'-'}`;
      const btn=document.createElement('button');btn.className='btn btn-green';btn.textContent='Add to cart';
      btn.addEventListener('click',()=>addToCart(p.id));
      details.append(name,price,stock,vendor,btn);
      wrap.append(img,details);
      return wrap;
    }

    function renderCartSection(){
      const sec=sectionCard('Your Cart');
      if(cart.length===0){sec.appendChild(pText('Cart is empty.'));return sec;}
      const table=document.createElement('table');
      const thead=document.createElement('thead');
      thead.innerHTML='<tr><th>Product</th><th>Qty</th><th>Price</th><th>Subtotal</th><th>Vendor</th><th></th></tr>';
      table.appendChild(thead);
      const tbody=document.createElement('tbody');let total=0;
      cart.forEach(ci=>{
        const p=findProduct(ci.id);if(!p)return;
        const subtotal=p.price*ci.qty;total+=subtotal;
        const tr=document.createElement('tr');
        const tdName=document.createElement('td');tdName.textContent=p.name;
        const tdQty=document.createElement('td');
        const qtyWrap=document.createElement('div');qtyWrap.className='qty-controls';
        const btnDec=document.createElement('button');btnDec.className='btn btn-small';btnDec.textContent='-';
        const qtySpan=document.createElement('span');qtySpan.textContent=ci.qty;
        const btnInc=document.createElement('button');btnInc.className='btn btn-small';btnInc.textContent='+';
        btnDec.addEventListener('click',()=>updateCartQty(ci.id,Math.max(1,ci.qty-1)));
        btnInc.addEventListener('click',()=>updateCartQty(ci.id,Math.min(p.qty,ci.qty+1)));
        qtyWrap.append(btnDec,qtySpan,btnInc);
        tdQty.appendChild(qtyWrap);
        const tdPrice=document.createElement('td');tdPrice.textContent=`₹${p.price}`;
        const tdSub=document.createElement('td');tdSub.textContent=`₹${subtotal}`;
        const tdVendor=document.createElement('td');tdVendor.textContent=p.vendorName||'-';
        const tdActions=document.createElement('td');
        const removeBtn=document.createElement('button');removeBtn.className='btn btn-red';removeBtn.textContent='Remove';
        removeBtn.addEventListener('click',()=>removeFromCart(ci.id));
        tdActions.appendChild(removeBtn);
        tr.append(tdName,tdQty,tdPrice,tdSub,tdVendor,tdActions);
        tbody.appendChild(tr);
      });
      const tf=document.createElement('tfoot');
      const trf=document.createElement('tr');
      trf.innerHTML=`<td colspan="3"><strong>Total</strong></td><td><strong>₹${total}</strong></td><td colspan="2"></td>`;
      tf.appendChild(trf);
      table.append(tbody,tf);
      sec.appendChild(table);
      const actions=document.createElement('div');
      actions.style.marginTop='10px';
      const placeBtn=document.createElement('button');placeBtn.className='btn btn-blue';placeBtn.textContent='Place Order';
      placeBtn.addEventListener('click',placeOrder);
      const clearBtn=document.createElement('button');clearBtn.className='btn';clearBtn.textContent='Clear Cart';
      clearBtn.style.marginLeft='8px';
      clearBtn.addEventListener('click',()=>{if(confirm('Clear the cart?'))clearCart();});
      actions.append(placeBtn,clearBtn);
      sec.appendChild(actions);
      return sec;
    }

    function addToCart(id){const p=findProduct(id);if(!p||p.qty<=0)return alert('Out of stock');const item=cart.find(c=>c.id===id);if(item){if(item.qty<p.qty)item.qty++;}else{cart.push({id,qty:1});}saveAll();render();}
    function updateCartQty(id,qty){const item=cart.find(c=>c.id===id);const p=findProduct(id);if(!item||!p)return;item.qty=Math.max(1,Math.min(qty,p.qty));saveAll();render();}
    function removeFromCart(id){cart=cart.filter(c=>c.id!==id);saveAll();render();}
    function clearCart(){cart=[];saveAll();render();}

    function placeOrder(){
      if(cart.length===0)return alert('Cart empty');
      for(const c of cart){
        const p=findProduct(c.id);
        if(!p)return alert('A product in your cart no longer exists.');
        if(c.qty>p.qty)return alert(`Insufficient stock for "${p.name}". Only ${p.qty} left.`);
      }
      cart.forEach(c=>{const p=findProduct(c.id);if(p)p.qty-=c.qty;});
      cart=[];
      saveAll();
      let msg="✅ Order placed successfully!\n\nVendor Details:\n";
      products.forEach(p=>{
        if(p.vendorName) msg+=`\n${p.vendorName} | 📞 ${p.vendorPhone||'-'} | 🏠 ${p.vendorAddress||'-'}`;
      });
      alert(msg);
      render();
    }

    function renderVendor(){
      const infoSec=sectionCard('Your Details');
      const nameInfo=input('v_nameinfo','Vendor Name','text');
      const phoneInfo=input('v_phoneinfo','Phone Number','tel');
      const addrInfo=input('v_addrinfo','Address','text');
      infoSec.append(nameInfo,phoneInfo,addrInfo);
      main.appendChild(infoSec);

      const addSec=sectionCard('Add Product');
      const form=document.createElement('div');
      const nameIn=input('v_name','Product Name');
      const priceIn=input('v_price','Price (₹)','number',{min:0});
      const qtyIn=input('v_qty','Quantity','number',{min:0});
      const imgIn=input('v_img','Image URL');
      const pubLabel=document.createElement('label');
      const pubChk=document.createElement('input');pubChk.type='checkbox';pubChk.id='v_pub';
      pubLabel.append(pubChk,document.createTextNode(' Published'));
      const addBtn=document.createElement('button');addBtn.className='btn btn-blue';addBtn.textContent='Add Product';
      addBtn.addEventListener('click',()=>{
        const vendorName=sanitizeText(nameInfo.value);
        const vendorPhone=sanitizeText(phoneInfo.value);
        const vendorAddress=sanitizeText(addrInfo.value);
        addProduct({
          name:sanitizeText(nameIn.value),
          price:Number(priceIn.value||0),
          qty:Math.max(0,Number(qtyIn.value||0)),
          img:sanitizeText(imgIn.value),
          published:pubChk.checked,
          vendorName,vendorPhone,vendorAddress
        });
        nameIn.value=priceIn.value=qtyIn.value=imgIn.value='';
        pubChk.checked=false;
      });
      form.append(nameIn,priceIn,qtyIn,imgIn,pubLabel,addBtn);
      addSec.appendChild(form);
      main.appendChild(addSec);

      const listSec=sectionCard('Your Products');
      if(products.length===0){listSec.appendChild(pText('No products added yet.'));}
      else products.forEach(p=>listSec.appendChild(vendorProductNode(p))); 
      main.appendChild(listSec);
    }

    function addProduct({name,price,qty,img,published,vendorName,vendorPhone,vendorAddress}){
      if(!name||price<=0)return alert('Name and positive price required');
      const id='p'+Date.now()+Math.floor(Math.random()*900);
      products.push({id,name,price,qty,img,published,vendorName,vendorPhone,vendorAddress});
      saveAll();
      render();
    }

    function vendorProductNode(p){
      const wrap=document.createElement('div');
      wrap.className='product';
      const img=document.createElement('img');img.src=productImageURL(p);img.alt=p.name;
      const details=document.createElement('div');details.className='product-details';
      const title=document.createElement('div');title.innerHTML=`<strong>${p.name}</strong>`;
      const meta=document.createElement('div');meta.className='muted';meta.textContent=`₹${p.price} | ${p.qty} qty`;
      const vendor=document.createElement('div');vendor.className='muted';vendor.textContent=`Vendor: ${p.vendorName||'Unknown'}`;
      const pubLabel=document.createElement('label');
      const chk=document.createElement('input');chk.type='checkbox';chk.checked=!!p.published;
      chk.addEventListener('change',()=>{p.published=chk.checked;saveAll();});
      pubLabel.append(chk,document.createTextNode(' Published'));
      const del=document.createElement('button');del.className='btn btn-red';del.textContent='Delete';
      del.addEventListener('click',()=>{if(confirm('Delete this product?')){products=products.filter(x=>x.id!==p.id);saveAll();render();}});
      details.append(title,meta,vendor,pubLabel,document.createElement('br'),del);
      wrap.append(img,details);
      return wrap;
    }

    function sectionCard(title){const s=document.createElement('section');s.className='card';const h=document.createElement('h2');h.textContent=title;s.appendChild(h);return s;}
    function pText(t){const p=document.createElement('p');p.className='muted';p.textContent=t;return p;}
    function input(id,ph,type='text',attrs={},val=''){const el=document.createElement('input');el.id=id;el.className='input-box';el.type=type;el.placeholder=ph;el.value=val;Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));return el;}
    render();
  </script>
</body>
</html>
